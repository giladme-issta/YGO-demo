<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!-- modern flat map mock — soft neutral base, green parks, a river, a clean
       white road network with casings, and building blocks. Purely decorative. -->
  <rect width="1200" height="900" fill="#e9ecef"/>

  <!-- districts: barely-there tonal blocks for depth -->
  <g fill="#e4e8eb">
    <rect x="-20" y="-20" width="470" height="360" rx="26"/>
    <rect x="760" y="470" width="520" height="480" rx="30"/>
    <rect x="120" y="560" width="360" height="380" rx="26"/>
  </g>

  <!-- parks -->
  <g fill="#cfe9c9">
    <path d="M690 40 C 900 20 1120 90 1180 250 C 1210 340 1120 430 960 430 C 780 430 690 340 660 230 C 640 150 640 70 690 40 Z"/>
    <ellipse cx="250" cy="740" rx="190" ry="150"/>
    <ellipse cx="560" cy="150" rx="120" ry="92"/>
  </g>

  <!-- river -->
  <path d="M-60 470 C 180 420 300 560 520 520 C 760 476 840 360 1010 372 C 1130 380 1210 350 1260 356"
        fill="none" stroke="#bfe1f2" stroke-width="58" stroke-linecap="round"/>

  <!-- road casings -->
  <g fill="none" stroke="#d5dbe0" stroke-linecap="round">
    <path d="M-40 250 C 260 210 460 320 760 250 C 980 198 1120 250 1260 220" stroke-width="26"/>
    <path d="M120 -40 C 180 260 120 520 260 940" stroke-width="24"/>
    <path d="M700 -40 C 660 260 780 520 720 940" stroke-width="24"/>
    <path d="M-40 700 C 300 660 700 760 1260 690" stroke-width="22"/>
    <path d="M980 -40 C 1000 260 940 560 1040 940" stroke-width="20"/>
  </g>
  <!-- roads -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M-40 250 C 260 210 460 320 760 250 C 980 198 1120 250 1260 220" stroke-width="16"/>
    <path d="M120 -40 C 180 260 120 520 260 940" stroke-width="14"/>
    <path d="M700 -40 C 660 260 780 520 720 940" stroke-width="14"/>
    <path d="M-40 700 C 300 660 700 760 1260 690" stroke-width="13"/>
    <path d="M980 -40 C 1000 260 940 560 1040 940" stroke-width="12"/>
  </g>
  <!-- minor streets -->
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <path d="M40 120 L420 90"/>
    <path d="M60 420 L470 470"/>
    <path d="M330 60 L360 540"/>
    <path d="M470 40 L500 520"/>
    <path d="M300 760 L470 640"/>
    <path d="M820 520 L1180 470"/>
    <path d="M880 560 L1120 900"/>
    <path d="M980 500 L1240 560"/>
    <path d="M540 600 L660 900"/>
  </g>

  <!-- building blocks -->
  <g fill="#dbe1e6">
    <rect x="150" y="150" width="70" height="52" rx="7"/>
    <rect x="236" y="140" width="58" height="60" rx="7"/>
    <rect x="150" y="222" width="60" height="70" rx="7"/>
    <rect x="230" y="222" width="64" height="70" rx="7"/>
    <rect x="820" y="560" width="72" height="58" rx="7"/>
    <rect x="906" y="556" width="60" height="64" rx="7"/>
    <rect x="822" y="636" width="66" height="60" rx="7"/>
    <rect x="906" y="640" width="64" height="66" rx="7"/>
    <rect x="200" y="620" width="66" height="58" rx="7"/>
    <rect x="280" y="628" width="58" height="56" rx="7"/>
  </g>
</svg>
